# 发行构建: *-tags 分支 push 或 v* tag 触发，产出正式 GitHub Release
name: release

on:
  push:
    branches: ["*-tags"]
    tags: ["v*"]

env:
  PNPM_VERSION: 12

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm -C apps/web build

      - name: Build Go sidecar
        working-directory: apps/server
        run: |
          TRIPLE=$(rustc -vV | sed -n 's|host: ||p')
          mkdir -p ../desktop/src-tauri/binaries
          EXT=""; [ "${{ matrix.os }}" = "windows-latest" ] && EXT=".exe"
          go build -ldflags "-s -w" -o "../desktop/src-tauri/binaries/digestly-server-${TRIPLE}${EXT}" .
        shell: bash

      - name: Build & upload Release
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 签名密钥(后续配置):
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/desktop/src-tauri/target/release/bundle/**

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm -C apps/web build

      # TODO(移动端 A 方案): 接入 gomobile 把 core 编为 .aar 替换 sidecar。
      # 当前先以 debug APK 验证 Tauri 移动端打包链路。
      - name: Init Android project
        working-directory: apps/desktop
        run: pnpm tauri android init || echo "android project already exists"

      - name: Build debug APK
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: pnpm tauri android build --apk --debug || echo "android build needs follow-up config"

      - uses: actions/upload-artifact@v4
        with:
          name: digestly-android-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
