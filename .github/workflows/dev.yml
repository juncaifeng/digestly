# dev 构建: 任何 *-dev 分支 push 即触发，产出各平台快照包(不发布 Release)
name: dev-build

on:
  push:
    branches: ["*-dev"]

env:
  PNPM_VERSION: 12

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm -C apps/web build

      - name: Build Go sidecar
        working-directory: apps/server
        run: |
          TRIPLE=$(rustc -vV | sed -n 's|host: ||p')
          mkdir -p ../desktop/src-tauri/binaries
          EXT=""; [ "${{ matrix.os }}" = "windows-latest" ] && EXT=".exe"
          go build -ldflags "-s -w" -o "../desktop/src-tauri/binaries/digestly-server-${TRIPLE}${EXT}" .
        shell: bash

      - name: Build Tauri app
        working-directory: apps/desktop
        run: pnpm tauri build -- --verbose

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digestly-dev-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
