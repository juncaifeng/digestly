# 向量模型预设(schema 见 openai.yml 头注释)
name: llama.cpp(本地)
base_url: http://127.0.0.1:8080/v1
docs: https://github.com/ggml-org/llama.cpp/blob/master/examples/server/README.md
note: 本地运行时;llama-server --embedding -m <gguf 模型> 启动;无需 api key
local: true
models:
  - id: bge-m3-Q4
    label: bge-m3 GGUF(自命名,以启动文件为准)
    dimensions: 1024
  - id: bge-small-zh-v1.5
    label: bge-small-zh(轻量中文)
    dimensions: 512
